<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <img class="brand__logo" src="logo.svg" alt="Sura" />
      <div class="brand__text">
        <span class="brand__title">Gestión de Tareas</span>
        <span class="brand__subtitle">Open Horizons · Plataforma interna</span>
      </div>
    </div>

    <div class="partner">
      <span class="partner__divider" aria-hidden="true"></span>
      <img class="partner__logo" src="logo-nttdata.png" alt="NTT DATA" />
    </div>
  </div>

  <nav class="nav">
    <a class="nav__link" routerLink="/" routerLinkActive="nav__link--active" [routerLinkActiveOptions]="{ exact: true }">Tareas</a>
    <a class="nav__link" routerLink="/chat" routerLinkActive="nav__link--active">Chat</a>
  </nav>
</header>

<router-outlet></router-outlet>
