apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohorizons-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ohorizons-ms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ohorizons-ms
    spec:
      containers:
        - name: spa
          image: ohorizons-ms:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: ohorizons-ms-config
                  key: API_UPSTREAM

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
